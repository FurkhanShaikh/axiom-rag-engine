name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token for every job (a reusable call from publish.yml gets the
# caller's grant, which is also read-only).
permissions:
  contents: read

# A new push to a PR supersedes its running checks. Runs for main and tags are
# keyed by ref and commit, so none is cancelled, and a release's CI never
# queues behind main's run of the same commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Mypy type checking
        run: uv run mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: uv run pytest -m "not integration" --cov=axiom_rag_engine --cov-report=term-missing

  test-image-python:
    # The suite on whatever Python the Docker image ships, read from the
    # Dockerfile, so a base-image bump (e.g. from Dependabot) is tested on the
    # version it would actually run even when it is outside the matrix above.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read the image's Python version
        id: py
        run: |
          version=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -1)
          test -n "$version" || { echo "::error::no 'FROM python:X.Y' in Dockerfile"; exit 1; }
          echo "Docker image Python: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with:
          python-version: ${{ steps.py.outputs.version }}
      - name: Run tests on the image's Python
        run: uv run pytest -m "not integration" -q -p no:cacheprovider

  evals-gate:
    # Deterministic quality gates — no LLM keys, no cost. Three checks:
    #   1. Golden set through the retriever/scorer/ranker + pre-LLM
    #      answerability gate (every case must clear its expectation).
    #   2. BM25 retrieval quality over SciFact (recall@k / nDCG / MRR must not
    #      regress) — the baseline hybrid retrieval must beat.
    #   3. Production-shaped retrieval: the shipped retriever/scorer/ranker
    #      over a 10-document pool per claim (p@1 / MRR / evidence recall).
    # The keyed semantic + full e2e evals run nightly (nightly-evals.yml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Download SciFact
        # The BM25 retrieval gate scores against SciFact, which is gitignored
        # (evals/data/), so it must be fetched here. ~3 MB, no keys.
        run: uv run python evals/download_datasets.py
      - name: Regression gates (golden answerability + BM25 retrieval)
        env:
          AXIOM_ENV: development
        run: uv run python tasks.py evals gate
      # Per-query records behind the gated numbers, for any PR or commit.
      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-gate-results
          path: evals/results/*.json
          if-no-files-found: warn

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Dependency vulnerability scan
        run: uv run pip-audit

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t axiom-rag-engine:ci .
      # Boot the image next to a Redis, as docker-compose does, and check it
      # serves: readiness passes, the cache really is Redis (the redis extra
      # is installed), and the numpy extra imports.
      - name: Smoke test the image
        run: |
          set -euo pipefail
          trap 'docker logs axiom-smoke || true; docker rm -f axiom-smoke smoke-redis >/dev/null 2>&1 || true' EXIT
          docker network create smoke
          # The same Redis image docker-compose runs, so the two cannot drift.
          redis_image=$(sed -nE 's/^ *image: (redis:[^ ]+).*/\1/p' docker-compose.yml | head -1)
          test -n "$redis_image"
          docker run -d --name smoke-redis --network smoke "$redis_image"
          docker run -d --name axiom-smoke --network smoke -p 8000:8000 \
            -e AXIOM_ENV=development \
            -e AXIOM_REDIS_URL=redis://smoke-redis:6379/0 \
            axiom-rag-engine:ci
          for _ in $(seq 1 45); do
            curl -fsS http://localhost:8000/health/ready >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8000/health/ready | tee ready.json
          curl -fsS http://localhost:8000/v1/status > status.json
          python3 - <<'PY'
          import json
          ready = json.load(open("ready.json"))
          status = json.load(open("status.json"))
          assert ready["status"] == "ok", ready
          backend = status["cache"]["backend"]
          assert backend == "RedisCacheBackend", f"cache is {backend}, not Redis"
          print("ready:", ready, "| cache:", backend)
          PY
          docker exec axiom-smoke python -c "import numpy, redis; print('extras ok')"
      # Trivy runs from its pinned image (no third-party action). Fails on
      # critical vulnerabilities that have a fix; the SBOM is kept as an artifact.
      - name: Scan image for vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 image --exit-code 1 --severity CRITICAL \
            --ignore-unfixed --no-progress axiom-rag-engine:ci
      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/out" aquasec/trivy:0.58.1 image --format cyclonedx \
            --output /out/sbom.cdx.json --no-progress axiom-rag-engine:ci
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.cdx.json

  compose-smoke:
    # The whole docker-compose stack, started and checked service by service
    # (.github/scripts/compose-smoke.sh): engine ready with Redis as cache,
    # engine -> Ollama reachable, Prometheus scraping the engine, Grafana
    # healthy with the dashboard and datasource provisioned. Makes image bumps
    # to any compose service testable without running the stack by hand.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start and check the stack
        run: .github/scripts/compose-smoke.sh
