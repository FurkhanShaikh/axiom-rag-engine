name: Nightly Evals

# Keyed quality evals — cost money, so they run on a schedule (and on demand),
# not on every PR. The deterministic gate that runs per-PR lives in ci.yml.
#
# Activation: add one provider key as a repository secret. The verifier model
# follows the key: OPENAI_API_KEY -> gpt-4o-mini, OPENROUTER_API_KEY ->
# openrouter/openai/gpt-4o-mini (same model), ANTHROPIC_API_KEY ->
# claude-haiku-4-5. With no key the job warns while the baseline is
# report-only and fails once it is enforced.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      limit:
        description: "Max SciFact examples to score (0 = all)"
        required: false
        default: "200"

permissions:
  contents: read

jobs:
  semantic-verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Choose the verifier from the configured key
        id: guard
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            model=gpt-4o-mini
          elif [ -n "$OPENROUTER_API_KEY" ]; then
            model=openrouter/openai/gpt-4o-mini
          elif [ -n "$ANTHROPIC_API_KEY" ]; then
            model=claude-haiku-4-5
          else
            enforcement=$(python3 -c "import json; print(json.load(open('evals/baselines/semantic-verifier.json'))['enforcement'])")
            {
              echo "### Semantic verifier not measured"
              echo "No \`OPENAI_API_KEY\`, \`OPENROUTER_API_KEY\` or \`ANTHROPIC_API_KEY\` secret is configured."
              echo "See BENCHMARKS.md, *Recording the baseline*."
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$enforcement" = "enforce" ]; then
              # An enforced gate that silently stops running is worse than a
              # red nightly: fail until the key is restored.
              echo "::error title=Semantic verifier not measured::The baseline is enforced but no provider key secret is configured."
              exit 1
            fi
            echo "::warning title=Semantic verifier not measured::No provider key secret configured - verifier quality is unmeasured (baseline is still report-only)."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Install uv
        if: steps.guard.outputs.run == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        run: uv python install 3.11

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: uv sync --locked

      - name: Download SciFact
        if: steps.guard.outputs.run == 'true'
        run: uv run python evals/download_datasets.py

      - name: Semantic verifier eval (gate)
        if: steps.guard.outputs.run == 'true'
        env:
          AXIOM_ENV: development
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Report-only until a baseline is recorded (--record, see
        # BENCHMARKS.md); once enforced, a regression fails this job. A
        # baseline recorded on a different model is reported, not enforced.
        run: |
          uv run python evals/semantic_verifier_eval.py \
            --model "${{ steps.guard.outputs.model }}" \
            --limit "${{ github.event.inputs.limit || '200' }}" \
            --gate

      - name: Upload eval results
        if: steps.guard.outputs.run == 'true' && always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-eval-results
          path: evals/results/semantic-*.json
          if-no-files-found: warn
