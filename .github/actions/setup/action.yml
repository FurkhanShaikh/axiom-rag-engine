name: Set up Python and dependencies
description: >
  Install uv (with its download cache keyed on uv.lock), the requested Python,
  and the locked dependencies. `--locked` fails if uv.lock no longer matches
  pyproject.toml, so CI never tests a stale lock.
inputs:
  python-version:
    description: Python version to install
    default: "3.11"
runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}
    - name: Install dependencies
      shell: bash
      run: uv sync --locked
