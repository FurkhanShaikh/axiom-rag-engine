version: 2
updates:
  # "uv" (not "pip") so bumps update uv.lock too: CI installs with
  # `uv sync --locked`, which fails on a lock that no longer matches
  # pyproject.toml, so a bump is always tested at its new version.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # Minor and patch bumps land as one PR (each bump rewrites uv.lock, so
    # separate PRs conflict with each other); major bumps stay individual.
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  # Base image in the Dockerfile and the pinned sidecar images in compose.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
