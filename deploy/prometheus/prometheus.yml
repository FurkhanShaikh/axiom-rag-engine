global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: axiom-rag-engine
    metrics_path: /metrics
    # When the engine sets AXIOM_METRICS_TOKEN, send it as a bearer token:
    # authorization:
    #   credentials_file: /etc/prometheus/axiom-metrics-token
    static_configs:
      - targets:
          - axiom-rag-engine:8000
        labels:
          service: axiom-rag-engine
